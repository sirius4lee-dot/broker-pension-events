name: 증권사 연금/ISA 이벤트 주간 요약

on:
  schedule:
    - cron: "17 23 * * 0"   # 매주 월요일 08:17 KST
  workflow_dispatch:
    inputs:
      test:
        description: "알림 제목에 [테스트] 표시"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: weekly

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: 수집 및 알림
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m scraper.run ${{ inputs.test && '--test' || '' }}
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "주간 이벤트 갱신 $(TZ=Asia/Seoul date +%F)" && git push)
